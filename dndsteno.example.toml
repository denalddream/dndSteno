# Скопируйте в dndsteno.toml и поправьте под себя.
# Все поля необязательные — здесь показаны значения по умолчанию.

# Всё это можно менять и в программе: страница «Настройки».

[general]
# Папка, где лежат сессии: sessions/<дата>/audio, transcript.md, ...
sessions_dir = "sessions"

[record]
# «Имя [драйвер]» из steno devices, номер или часть имени. Пусто — системный по умолчанию.
# Список устройств: steno devices
device = ""
# 16 кГц моно — ровно то, что нужно Whisper. Если устройство не умеет,
# запись пойдёт на его родной частоте.
samplerate = 16000
# Длина одного файла записи. Если что-то упадёт, потеряется максимум один кусок.
chunk_minutes = 20

[transcribe]
# tiny | base | small | medium | large-v3 | large-v3-turbo
model = "large-v3-turbo"
# cpu | cuda | auto
device = "cpu"
# int8 — быстро на CPU; на NVIDIA можно float16
compute_type = "int8"
language = "ru"
beam_size = 5
# Вырезать тишину перед распознаванием (меньше галлюцинаций, быстрее)
vad = true
# Имена персонажей, NPC, локаций — Whisper будет писать их правильно.
glossary = []
# Или файл со словарём: по одному слову/имени на строку.
glossary_file = ""

[llm]
# OpenAI-совместимый сервер. LM Studio: Developer → Start Server.
base_url = "http://127.0.0.1:1234/v1"
# Пусто — модель, которая сейчас загружена в LM Studio.
model = ""
temperature = 0.3
# Расшифровка режется на куски такой длины (12000 символов ≈ 5–6 тыс. токенов).
# Контекст модели в LM Studio должен быть заметно больше — от 16384.
chunk_chars = 12000
timeout = 900

[obsidian]
vault_dir = ""                  # например C:\Users\...\Obsidian Vault\DnD
campaign_dir = ""               # папка кампании внутри vault, например «Большой куш»
sessions_dir = "Сессии"         # куда писать заметки о сессиях (внутри кампании)
new_notes_dir = "Новое от нейросети"
callout = "ai"                  # блоки нейросети: > [!ai]
