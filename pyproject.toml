[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dndsteno"
version = "0.1.0"
description = "Запись и расшифровка D&D-партий с выгрузкой в Obsidian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "faster-whisper>=1.1",
    # av 19 dropped open(metadata_errors=...), which faster-whisper 1.2.1 still passes.
    "av<19",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
steno = "dndsteno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
